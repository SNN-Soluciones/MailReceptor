# Actualizaciones automáticas de dependencias (gratis en GitHub). Los PRs
# llegan con el changelog y el CI de arriba los valida; mergearlos sigue
# siendo decisión humana.
version: 2
updates:
  - package-ecosystem: maven
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    groups:
      spring:
        patterns: ["org.springframework*"]
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
