spring:
  datasource:
    driver-class-name: org.postgresql.Driver
    url: jdbc:postgresql://${DB_HOST:localhost}:${DB_PORT:5432}/${DB_NAME:nathbitpos}
    username: ${DB_USERNAME:snnsoluciones}
    password: ${DB_PASSWORD}
    hikari:
      minimum-idle: 2
      maximum-pool-size: 6
      connection-timeout: 10000

  jpa:
    hibernate:
      ddl-auto: none
    database-platform: org.hibernate.dialect.PostgreSQLDialect
    show-sql: false

  mail:
    host: smtp.gmail.com
    port: 587
    username: ${GMAIL_USERNAME:fe@samyx.digital}
    password: ${GMAIL_PASSWORD}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true

nathbit:
  api:
    url: https://api.nathbit.com  # Cambiar en producción
    api-key: ${NATHBIT_API_KEY}

imap:
  host: imap.gmail.com
  port: 993

server:
  port: 5002

logging:
  level:
    digital.samyx.mailreceptor: INFO