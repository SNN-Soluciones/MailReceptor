spring:
  mail:
    host: smtp.gmail.com
    port: 587
    # Solo lo usa el sender SMTP (notificaciones, hoy sin uso). Defaults vacíos
    # para que el arranque no dependa de este secreto: el IMAP usa credenciales
    # por buzón. Ningún valor real vive en el repo.
    username: ${GMAIL_USERNAME:}
    password: ${GMAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true

nathbit:
  api:
    url: ${NATHBIT_API_URL:https://api.nathbit.com}
    api-key: ${NATHBIT_API_KEY}

imap:
  host: imap.gmail.com
  port: 993

server:
  port: 5002

logging:
  level:
    digital.samyx.mailreceptor: INFO
