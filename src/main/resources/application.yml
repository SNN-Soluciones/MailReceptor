spring:
  mail:
    host: smtp.gmail.com
    port: 587
    # Solo lo usa el sender SMTP (hoy sin uso); el IMAP usa credenciales por buzón.
    username: ${GMAIL_USERNAME:}
    password: ${GMAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true

# Configuración NathBit API
nathbit:
  api:
    url: ${NATHBIT_API_URL:https://api.nathbit.com}
    # Misma llave que APP_MAILRECEPTOR_API_KEY en el core. Sin default:
    # el servicio no arranca si falta la variable de entorno.
    api-key: ${NATHBIT_API_KEY}

# IMAP
imap:
  host: imap.gmail.com
  port: 993

server:
  port: 5002

logging:
  level:
    digital:
      samyx:
        mailreceptor: DEBUG