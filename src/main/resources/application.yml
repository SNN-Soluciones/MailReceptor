spring:
  mail:
    host: smtp.gmail.com
    port: 587
    # Credenciales SMTP del sender de notificaciones (hoy sin uso). NUNCA van en
    # el repo: antes había un usuario y una contraseña reales acá y quedaron en el
    # historial de git (hallazgo de gitleaks, rotadas). Se inyectan por variable
    # de entorno; vacías, el sender simplemente no autentica y el poller IMAP
    # (que usa credenciales por buzón) sigue funcionando.
    username: ${GMAIL_USERNAME:}
    password: ${GMAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
      mail.smtp.starttls.required: true

# Configuración NathBit API
nathbit:
  api:
    url: ${NATHBIT_API_URL:http://localhost:8080}
    # Misma API key que `app.mailreceptor.api-key` en el POS. Sin default: si no
    # está seteada, el POS rechaza las llamadas (401) y el log lo dice; mejor eso
    # que un valor de relleno que alguien termine copiando a producción.
    api-key: ${NATHBIT_API_KEY:}

# IMAP
imap:
  host: imap.gmail.com
  port: 993

server:
  port: 5002

logging:
  level:
    digital:
      samyx:
        mailreceptor: INFO
